<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Yesterday — AL-Adkar</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .item-meta { display:flex; gap:8px; align-items:center; color:var(--muted); font-size:0.95rem; }
    .list .card { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">Yesterday's Uncompleted</div>
      <div class="controls">
        <a href="options.html" class="icon-btn" title="Options">☰</a>
      </div>
    </header>

    <main class="container">
      <h2>Uncompleted — Yesterday</h2>
      <p class="small-muted">These items were not completed yesterday and were moved here at midnight. You can add them back to today's list or delete them.</p>

      <div id="yList" class="list" style="margin-top:12px"></div>
    </main>

    <footer class="footer small-muted">Local-only • Items clear from here when you delete or add back to today</footer>
  </div>

  <script src="common.js"></script>
  <script>
  (function(){
    const listEl = document.getElementById('yList');

    function loadPrev(){
      try{
        const raw = localStorage.getItem(AdkarUtils.LS_KEYS ? AdkarUtils.LS_KEYS.prev : 'prev_uncompleted_v1');
        return raw ? JSON.parse(raw) : [];
      }catch(e){ return []; }
    }

    function render(){
      const prev = loadPrev();
      listEl.innerHTML = '';
      if(prev.length === 0){
        listEl.innerHTML = '<div class="card"><div class="title">No uncompleted items from yesterday.</div></div>';
        return;
      }
      for(let i = prev.length - 1; i >= 0; i--){
        const it = prev[i];
        const el = document.createElement('div');
        el.className = 'card';
        const timeHtml = it.time ? `<span class="small-muted">${it.time}</span>` : `<span class="small-muted">No time</span>`;
        el.innerHTML = `<div style="flex:1">
                          <div class="title">${escapeHtml(it.title)}</div>
                          <div class="item-meta">${timeHtml} • ${escapeHtml(it.category || '')}</div>
                          <div class="small-muted" style="margin-top:6px">${escapeHtml(it.details || '')}</div>
                        </div>
                        <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end">
                          <div style="display:flex;gap:8px">
                            <button class="primary" data-add="${it.id}">Add to Today</button>
                            <button class="ghost" data-delete="${it.id}">Delete</button>
                          </div>
                        </div>`;
        // Add to today: copy into adkars list with today's date
        el.querySelector('[data-add]')?.addEventListener('click', ()=>{
          const all = loadAdkars();
          const copy = Object.assign({}, it, {
            id: 'a' + Date.now(),
            date: AdkarUtils.todayStr(),
            completed: false
          });
          all.push(copy);
          saveAdkars(all);
          // remove from prev
          const prevList = loadPrev().filter(x => x.id !== it.id);
          if(prevList.length) localStorage.setItem(AdkarUtils.LS_KEYS.prev, JSON.stringify(prevList));
          else localStorage.removeItem(AdkarUtils.LS_KEYS.prev);
          alert('Added to today.');
          render();
        });

        // Delete from yesterday list
        el.querySelector('[data-delete]')?.addEventListener('click', ()=>{
          if(!confirm('Delete this item from yesterday?')) return;
          const prevList = loadPrev().filter(x => x.id !== it.id);
          if(prevList.length) localStorage.setItem(AdkarUtils.LS_KEYS.prev, JSON.stringify(prevList));
          else localStorage.removeItem(AdkarUtils.LS_KEYS.prev);
          render();
        });

        listEl.appendChild(el);
      }
    }

    // init
    render();
    window.addEventListener('storage', render);
  })();
  </script>
</body>
</html>
